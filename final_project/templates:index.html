<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workplace Mental Health Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #444; }
        select, input, button { margin: 10px 0; padding: 10px; }
        #output { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Workplace Mental Health Analysis</h1>

    <label for="analysis">Select Analysis:</label>
    <select id="analysis">
        <option value="summary">Summary Statistics</option>
        <option value="correlation">Correlation Matrix</option>
        <option value="logistic_regression">Logistic Regression</option>
        <option value="sentiment_analysis">Sentiment Analysis</option>
        <option value="geographical_trends">Geographical Trends</option>
    </select>

    <div id="parameters" style="display: none;">
        <label for="regularization">Regularization Strength (C):</label>
        <input type="number" id="regularization" step="0.01" value="1.0">
    </div>

    <button onclick="runAnalysis()">Run Analysis</button>

    <div id="output"></div>

    <script>
        function runAnalysis() {
            const analysis = document.getElementById('analysis').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerText = 'Loading...';

            if (analysis === 'logistic_regression') {
                const regularization = parseFloat(document.getElementById('regularization').value);
                fetch('/logistic_regression', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ regularization: regularization })
                })
                .then(response => response.json())
                .then(data => outputDiv.innerText = JSON.stringify(data, null, 2))
                .catch(error => outputDiv.innerText = 'Error: ' + error);
            } else {
                fetch(`/${analysis}`)
                .then(response => response.json())
                .then(data => outputDiv.innerText = JSON.stringify(data, null, 2))
                .catch(error => outputDiv.innerText = 'Error: ' + error);
            }
        }

        document.getElementById('analysis').addEventListener('change', () => {
            const selected = document.getElementById('analysis').value;
            document.getElementById('parameters').style.display = selected === 'logistic_regression' ? 'block' : 'none';
        });
    </script>
</body>
</html>
